  <style>
    html, body {
      overflow-x: hidden !important; /* the page never scrolls sideways; only the rows do */
      overflow-y: auto !important;
      height: auto !important;
      min-height: 100vh;
    }

    main {
      width: 100%;
      padding: 0 !important; /* rows run edge to edge */
      align-items: stretch !important;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* One full-width row per project */
    .project-rows {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      min-width: 0;
      padding: 0.75rem 0 5rem;
    }

    /* Each row is exactly the screen's width (it used to stretch to the width
       of all its images, which caused the blank space) */
    .project-row {
      position: relative;
      display: block;
      width: 100%;
      min-width: 0;
      height: 72vh;
      min-height: 320px;
      overflow: hidden;
      text-decoration: none;
      color: var(--color-text);
    }

    /* The strip of images: slides on its own in a loop, and can be scrolled
       sideways (trackpad) or dragged with the mouse */
    .project-track {
      display: flex;
      gap: 0.75rem;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .project-track::-webkit-scrollbar {
      display: none;
    }

    .project-track.is-dragging {
      cursor: grabbing;
      user-select: none;
    }

    .project-track li {
      height: 100%;
      flex-shrink: 0;
    }

    .project-track img {
      display: block;
      height: 100%;
      width: auto;
      -webkit-user-drag: none;
    }

    /* Title pill, centred over the row */
    .project-pill {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      padding: 0.6rem 1.25rem;
      border-radius: 999px;
      background-color: #DFFF00;
      color: var(--color-text);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Pill colours rotate row by row: chartreuse, cobalt, tomato */
    /* (nth-of-type counts only the image rows, so the text tickers between them don't shift the colours) */
    .project-row:nth-of-type(3n+2) .project-pill { background-color: var(--cobalt); color: #fff; }
    .project-row:nth-of-type(3n) .project-pill { background-color: var(--tomato); color: #fff; }

    /* On hover each pill switches to the next colour */
    .project-row:nth-of-type(3n+1):hover .project-pill,
    .project-row:nth-of-type(3n+1):focus-visible .project-pill { background-color: var(--cobalt); color: #fff; }
    .project-row:nth-of-type(3n+2):hover .project-pill,
    .project-row:nth-of-type(3n+2):focus-visible .project-pill { background-color: var(--tomato); color: #fff; }
    .project-row:nth-of-type(3n):hover .project-pill,
    .project-row:nth-of-type(3n):focus-visible .project-pill { background-color: var(--chartreuse); color: var(--color-text); }

    /* ---------- Text tickers between the image rows ----------
       Slim rows of small mono text and links that slide at the same speed as
       the images and loop the same way. A small label pill sits at the left. */
    .text-row {
      position: relative;
      width: 100%;
      min-width: 0;
      height: 46px;
      overflow: hidden;
      border-top: 1px solid var(--color-text);
      border-bottom: 1px solid var(--color-text);
    }

    .text-track {
      display: flex;
      align-items: center;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      list-style: none;
      margin: 0;
      padding: 0;
      white-space: nowrap;
    }

    .text-track::-webkit-scrollbar {
      display: none;
    }

    .text-track.is-dragging {
      cursor: grabbing;
      user-select: none;
    }

    .text-track li {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--color-text);
    }

    /* A small dot between items */
    .text-track li::after {
      content: '';
      width: 7px;
      height: 7px;
      margin: 0 1.5rem;
      border-radius: 50%;
      background-color: var(--tomato);
    }

    .text-track a {
      color: inherit;
      text-decoration: none;
      padding: 0.2rem 0.3rem;
      margin: 0 -0.3rem;
      -webkit-user-drag: none;
    }

    .text-track a:hover,
    .text-track a:focus-visible {
      background-color: var(--chartreuse);
    }

    .text-track .arrow {
      margin-left: 0.4em;
    }

    .text-label {
      position: absolute;
      top: 50%;
      left: 1rem;
      transform: translateY(-50%);
      z-index: 2;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      background-color: var(--chartreuse);
      color: var(--color-text);
    }

    .text-label.is-cobalt { background-color: var(--cobalt); color: #fff; }
    .text-label.is-tomato { background-color: var(--tomato); color: #fff; }

    /* A cluster: one to three tickers stacked with no gap between them */
    .text-cluster {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-width: 0;
    }

    .text-cluster .text-row + .text-row {
      border-top: 0;
    }

    /* Ticker scales, picked at random for each ticker on each visit */
    .text-row.t-s  { height: 40px; }
    .text-row.t-m  { height: 58px; }
    .text-row.t-l  { height: 92px; }
    .text-row.t-xl { height: 140px; }

    .text-row.t-m li  { font-size: 20px; }
    .text-row.t-l li,
    .text-row.t-xl li {
      font-family: var(--font-main);
      letter-spacing: -0.01em;
    }
    .text-row.t-l li  { font-size: 44px; }
    .text-row.t-xl li { font-size: 78px; }

    .text-row.is-thin li { font-weight: 200; }
    .text-row.is-bold li { font-weight: 800; }

    .text-row.t-l li::after  { width: 12px; height: 12px; margin: 0 2.25rem; }
    .text-row.t-xl li::after { width: 18px; height: 18px; margin: 0 3rem; }

    @media (max-width: 768px) {
      .text-row.t-l  { height: 68px; }
      .text-row.t-xl { height: 96px; }
      .text-row.t-l li  { font-size: 30px; }
      .text-row.t-xl li { font-size: 50px; }
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      background-color: var(--color-bg);
    }

    @media (max-width: 768px) {
      main { padding: 0; }
      .project-row { height: 48vh; min-height: 260px; }
      .project-pill { font-size: 13px; }
    }

  </style>

  <script>
    // Generative text tickers: on each visit, build tickers from the pool above,
    // give each a random scale, and scatter them in clusters of one to three
    // among the image rows. Runs before the circular-row code so tickers loop too.
    (function () {
      const pool = document.getElementById('ticker-pool');
      const imageRows = [...document.querySelectorAll('.project-rows > .project-row')];
      if (!pool || !imageRows.length) return;

      const lists = [...pool.content.querySelectorAll('ul')].map((u) => ({
        label: u.dataset.label,
        items: [...u.children].map((li) => li.innerHTML)
      }));
      const rand = (n) => Math.floor(Math.random() * n);
      const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

      // Every category once, plus two or three remixes (one may mix all categories)
      const specs = lists.slice();
      const extras = 2 + rand(2);
      for (let k = 0; k < extras; k++) {
        if (Math.random() < 0.35) specs.push({ label: 'Selected', items: lists.flatMap((l) => l.items) });
        else specs.push(lists[rand(lists.length)]);
      }

      // Scales: mostly small and medium, some large, the odd huge one
      const pickSize = () => { const r = Math.random(); return r < 0.35 ? 't-s' : r < 0.65 ? 't-m' : r < 0.9 ? 't-l' : 't-xl'; };
      const labelColours = ['', 'is-cobalt', 'is-tomato'];

      // Scatter into clusters after the image rows (at most three per spot)
      const slots = imageRows.map(() => []);
      shuffle(specs).forEach((spec) => {
        let s, tries = 0;
        do { s = rand(slots.length); tries++; } while (slots[s].length >= 3 && tries < 20);
        slots[s].push(spec);
      });

      slots.forEach((specsHere, i) => {
        if (!specsHere.length) return;
        const cluster = document.createElement('div');
        cluster.className = 'text-cluster';
        specsHere.forEach((spec) => {
          const size = pickSize();
          const row = document.createElement('div');
          row.className = 'text-row ' + size;
          if (size === 't-l' || size === 't-xl') row.classList.add(Math.random() < 0.5 ? 'is-thin' : 'is-bold');
          row.setAttribute('role', 'region');
          row.setAttribute('aria-label', spec.label);
          if (size === 't-s' || size === 't-m') {
            const label = document.createElement('span');
            label.className = 'text-label ' + labelColours[rand(labelColours.length)];
            label.setAttribute('aria-hidden', 'true');
            label.textContent = spec.label;
            row.appendChild(label);
          }
          const track = document.createElement('ul');
          track.className = 'text-track';
          shuffle(spec.items).forEach((html) => { const li = document.createElement('li'); li.innerHTML = html; track.appendChild(li); });
          row.appendChild(track);
          cluster.appendChild(row);
        });
        imageRows[i].after(cluster);
      });

      // Short tickers: repeat their items until one round is wider than the screen
      document.querySelectorAll('.text-track').forEach((track) => {
        const originals = [...track.children];
        let guard = 0;
        while (track.scrollWidth < window.innerWidth * 1.2 && guard++ < 6) {
          originals.forEach((li) => track.appendChild(li.cloneNode(true)));
        }
      });
    })();

    // Circular rows: each row's images are repeated three times and the scroll
    // position is kept inside the middle copy, so the images always come back
    // around and there's never blank space. Rows slide on their own (about 40px
    // per second) and can also be scrolled sideways or dragged with the mouse.
    (function () {
      const SPEED = 40;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const rows = [];

      document.querySelectorAll('.project-track, .text-track').forEach((track) => {
        const originals = [...track.children];
        for (let k = 0; k < 2; k++) {
          originals.forEach((li) => {
            const copy = li.cloneNode(true);
            copy.setAttribute('aria-hidden', 'true');
            track.appendChild(copy);
          });
        }
        const row = { track, n: originals.length, carry: 0, dragging: false, moved: false, startX: 0, startLeft: 0 };
        rows.push(row);

        const setWidth = () => track.children[row.n].offsetLeft - track.children[0].offsetLeft;
        row.wrap = () => {
          const w = setWidth();
          if (w <= 0) return;
          if (track.scrollLeft < w * 0.5) track.scrollLeft += w;
          else if (track.scrollLeft > w * 1.5) track.scrollLeft -= w;
        };
        const start = () => { const w = setWidth(); if (w > 0) track.scrollLeft = w; };
        track.querySelectorAll('img').forEach((img) => img.addEventListener('load', row.wrap));
        track.addEventListener('scroll', row.wrap, { passive: true });
        window.addEventListener('load', start);
        start();

        // Drag with the mouse; a drag doesn't count as a click on the project link
        track.addEventListener('pointerdown', (e) => {
          if (e.pointerType !== 'mouse' || e.button !== 0) return;
          row.dragging = true; row.moved = false; row.startX = e.clientX; row.startLeft = track.scrollLeft;
        });
        window.addEventListener('pointermove', (e) => {
          if (!row.dragging) return;
          const dx = e.clientX - row.startX;
          if (!row.moved && Math.abs(dx) > 6) { row.moved = true; track.classList.add('is-dragging'); }
          if (row.moved) track.scrollLeft = row.startLeft - dx;
        });
        const endDrag = () => {
          if (!row.dragging) return;
          row.dragging = false;
          track.classList.remove('is-dragging');
        };
        // Every way a press can end, so a row can never get stuck "held"
        window.addEventListener('pointerup', endDrag);
        window.addEventListener('pointercancel', endDrag);
        window.addEventListener('blur', endDrag);
        document.addEventListener('mouseleave', endDrag);

        // Stop the browser's own "drag the link" behaviour (it used to swallow the
        // mouse release and freeze the row), and don't follow a link after a drag.
        // Image rows are one big link; text tickers contain many small links.
        const links = track.closest('a') ? [track.closest('a')] : [...track.querySelectorAll('a')];
        links.forEach((link) => {
          link.setAttribute('draggable', 'false');
          link.addEventListener('dragstart', (e) => e.preventDefault());
        });
        (track.closest('a') || track).addEventListener('click', (e) => {
          if (row.moved) { e.preventDefault(); e.stopPropagation(); row.moved = false; }
        }, true);
      });

      // The slow slide (never pauses on hover; only while a row is being dragged)
      if (reduceMotion) return;
      let last = performance.now();
      setInterval(() => {
        const now = performance.now();
        const dt = Math.min((now - last) / 1000, 0.1);
        last = now;
        rows.forEach((row) => {
          if (row.dragging) return;
          row.carry += SPEED * dt;
          const step = Math.floor(row.carry);
          if (step >= 1) { row.track.scrollLeft += step; row.carry -= step; }
          row.wrap();
        });
      }, 16);
    })();
  </script>

</body>
</html>
