  <style>
    html, body {
      overflow-x: hidden !important; /* the page never scrolls sideways; only the rows do */
      overflow-y: auto !important;
      height: auto !important;
      min-height: 100vh;
    }

    main {
      width: 100%;
      padding: 0 !important; /* rows run edge to edge */
      align-items: stretch !important;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* One full-width row per project */
    .project-rows {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      min-width: 0;
      padding: 0.75rem 0 5rem;
    }

    /* Each row is exactly the screen's width (it used to stretch to the width
       of all its images, which caused the blank space) */
    .project-row {
      position: relative;
      display: block;
      width: 100%;
      min-width: 0;
      height: 72vh;
      min-height: 320px;
      overflow: hidden;
      text-decoration: none;
      color: var(--color-text);
    }

    /* The strip of images: slides on its own in a loop, and can be scrolled
       sideways (trackpad) or dragged with the mouse */
    .project-track {
      display: flex;
      gap: 0.75rem;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .project-track::-webkit-scrollbar {
      display: none;
    }

    .project-track.is-dragging {
      cursor: grabbing;
      user-select: none;
    }

    .project-track li {
      height: 100%;
      flex-shrink: 0;
    }

    .project-track img {
      display: block;
      height: 100%;
      width: auto;
      -webkit-user-drag: none;
    }

    /* Title pill, centred over the row */
    .project-pill {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      padding: 0.6rem 1.25rem;
      border-radius: 999px;
      background-color: #DFFF00;
      color: var(--color-text);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Pill colours rotate row by row: chartreuse, cobalt, tomato */
    .project-row:nth-child(3n+2) .project-pill { background-color: var(--cobalt); color: #fff; }
    .project-row:nth-child(3n) .project-pill { background-color: var(--tomato); color: #fff; }

    /* On hover each pill switches to the next colour */
    .project-row:nth-child(3n+1):hover .project-pill,
    .project-row:nth-child(3n+1):focus-visible .project-pill { background-color: var(--cobalt); color: #fff; }
    .project-row:nth-child(3n+2):hover .project-pill,
    .project-row:nth-child(3n+2):focus-visible .project-pill { background-color: var(--tomato); color: #fff; }
    .project-row:nth-child(3n):hover .project-pill,
    .project-row:nth-child(3n):focus-visible .project-pill { background-color: var(--chartreuse); color: var(--color-text); }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      background-color: var(--color-bg);
    }

    @media (max-width: 768px) {
      main { padding: 0; }
      .project-row { height: 48vh; min-height: 260px; }
      .project-pill { font-size: 13px; }
    }

  </style>

  <script>
    // Circular rows: each row's images are repeated three times and the scroll
    // position is kept inside the middle copy, so the images always come back
    // around and there's never blank space. Rows slide on their own (about 40px
    // per second) and can also be scrolled sideways or dragged with the mouse.
    (function () {
      const SPEED = 40;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const rows = [];

      document.querySelectorAll('.project-track').forEach((track) => {
        const originals = [...track.children];
        for (let k = 0; k < 2; k++) {
          originals.forEach((li) => {
            const copy = li.cloneNode(true);
            copy.setAttribute('aria-hidden', 'true');
            track.appendChild(copy);
          });
        }
        const row = { track, n: originals.length, carry: 0, dragging: false, moved: false, startX: 0, startLeft: 0 };
        rows.push(row);

        const setWidth = () => track.children[row.n].offsetLeft - track.children[0].offsetLeft;
        row.wrap = () => {
          const w = setWidth();
          if (w <= 0) return;
          if (track.scrollLeft < w * 0.5) track.scrollLeft += w;
          else if (track.scrollLeft > w * 1.5) track.scrollLeft -= w;
        };
        const start = () => { const w = setWidth(); if (w > 0) track.scrollLeft = w; };
        track.querySelectorAll('img').forEach((img) => img.addEventListener('load', row.wrap));
        track.addEventListener('scroll', row.wrap, { passive: true });
        window.addEventListener('load', start);
        start();

        // Drag with the mouse; a drag doesn't count as a click on the project link
        track.addEventListener('pointerdown', (e) => {
          if (e.pointerType !== 'mouse' || e.button !== 0) return;
          row.dragging = true; row.moved = false; row.startX = e.clientX; row.startLeft = track.scrollLeft;
        });
        window.addEventListener('pointermove', (e) => {
          if (!row.dragging) return;
          const dx = e.clientX - row.startX;
          if (!row.moved && Math.abs(dx) > 6) { row.moved = true; track.classList.add('is-dragging'); }
          if (row.moved) track.scrollLeft = row.startLeft - dx;
        });
        const endDrag = () => {
          if (!row.dragging) return;
          row.dragging = false;
          track.classList.remove('is-dragging');
        };
        // Every way a press can end, so a row can never get stuck "held"
        window.addEventListener('pointerup', endDrag);
        window.addEventListener('pointercancel', endDrag);
        window.addEventListener('blur', endDrag);
        document.addEventListener('mouseleave', endDrag);

        // The row is a link: stop the browser's own "drag the link" behaviour,
        // which used to swallow the mouse release and freeze the row
        const link = track.closest('a');
        link.setAttribute('draggable', 'false');
        link.addEventListener('dragstart', (e) => e.preventDefault());
        link.addEventListener('click', (e) => {
          if (row.moved) { e.preventDefault(); row.moved = false; }
        });
      });

      // The slow slide (never pauses on hover; only while a row is being dragged)
      if (reduceMotion) return;
      let last = performance.now();
      setInterval(() => {
        const now = performance.now();
        const dt = Math.min((now - last) / 1000, 0.1);
        last = now;
        rows.forEach((row) => {
          if (row.dragging) return;
          row.carry += SPEED * dt;
          const step = Math.floor(row.carry);
          if (step >= 1) { row.track.scrollLeft += step; row.carry -= step; }
          row.wrap();
        });
      }, 16);
    })();
  </script>
